# The runtime's test robot: all five limbs, one of them spread over two buses, one with an offline joint and one with none
# (testing.md rule 3: never the live config/skeleton.yaml). The unit tests, the README example and the sim suite's
# runtime test (on vcan, so the buses are named as the sim suite's) all run it. rs03 throughout: the simulated rs03
# confirms a Disable, so every stop in the sim ends confirmed. The left arm is commissioned (its UIDs are sim-drive's for
# its IDs); every other joint has nulls, so is uncommissioned and enables only at its model's commissioning caps, except
# the left leg's offline joint, which has no bus and is refused.
schema: 1
name: runtime_test
power:
  source: bench_24v
  vbus_v: [22.0, 26.0]
  current_budget_a: 40.0
buses:
  can0:
    bitrate_bps: 1000000
    sample_point: 0.75
    adapter_serial: null
  can1:
    bitrate_bps: 1000000
    sample_point: 0.75
    adapter_serial: null
limbs:
  left_arm:
    joints:
      - name: arm_a_one
        actuator: rs03
        bus: can1
        id: 11
        uid: "0x73696d000b000000"
        direction: -1
        zero_rad: 2.0
        reference_pose: null
        hard_rad: [-0.5, 1.5]
        soft_rad: null
