# The runtime's test robot: all five limbs, one of them spread over two buses, one with an offline joint and one with none
# (testing.md rule 3: never the live config/skeleton.yaml). The unit tests, the README example and the sim suite's
# runtime test (on vcan, so the buses are named as the sim suite's) all run it. rs03 throughout: the simulated rs03
# confirms a Disable, so every stop in the sim ends confirmed.
schema: 1
name: runtime_test
power:
  source: bench_24v
  vbus_v: [22.0, 26.0]
  current_budget_a: 40.0
