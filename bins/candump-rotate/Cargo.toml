[package]
name = "candump-rotate"
description = "The CAN black box: runs candump on one bus and writes what it prints to hourly zstd files, pruning old ones"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# The runtime's revision stamp (`ROARK_GIT_REVISION`), so the journal names the build that wrote each file.
build = "../runtime/build.rs"

[dependencies]
zstd.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix.workspace = true

[lints]
workspace = true
