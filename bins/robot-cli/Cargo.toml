[package]
name = "robot-cli"
description = "The operator's command line; for now only `disable`, the independent stop systemd runs after the runtime exits"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# The runtime's build script, shared: it embeds the git revision as ROARK_GIT_REVISION (rust.md section 1).
build = "../runtime/build.rs"

[dependencies]
robstride.workspace = true
skeleton.workspace = true
serde_json.workspace = true
thiserror = { workspace = true, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix.workspace = true
socketcan.workspace = true

[lints]
workspace = true
