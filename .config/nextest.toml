# testing.md rule 12: slow warning at 5 s, killed at 60 s, no retries (a flaky test is fixed, not retried).
[profile.default]
retries = 0
slow-timeout = { period = "5s", terminate-after = 12 }
fail-fast = false
# The sim suite needs Linux with vcan can0 to can4 up; it runs only as `--profile sim` (scripts/sim.sh, CI gate 7).
default-filter = "not package(sim-suite)"

[profile.sim]
default-filter = "package(sim-suite)"

# The tests that share vcan can2 run one at a time: frames on one bus reach every socket on it.
[test-groups]
can2 = { max-threads = 1 }

[[profile.sim.overrides]]
filter = "package(sim-suite) & binary(bus) & (test(the_bus_loop_runs) | test(a_stopped_bus))"
test-group = "can2"
