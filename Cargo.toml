[workspace]
resolver = "3"
members = ["crates/*", "bins/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
can = { path = "crates/can" }
robstride = { path = "crates/robstride" }
safety = { path = "crates/safety" }
sim-drive = { path = "bins/sim-drive" }
skeleton = { path = "crates/skeleton" }
telemetry = { path = "crates/telemetry" }
libc = { version = "0.2.191", default-features = false }
mcap = { version = "0.26.0", default-features = false, features = ["zstd"] }
nix = { version = "0.31.3", default-features = false, features = ["poll", "signal", "socket", "time"] }
rtrb = { version = "0.4.1", default-features = false }
saphyr-parser = { version = "0.3.3", default-features = false }
schemars = { version = "1.2.3", default-features = false, features = ["derive", "std"] }
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
sha2 = { version = "0.11.1", default-features = false }
socketcan = { version = "4.0.0", default-features = false }
thiserror = { version = "2.0.21", default-features = false }

[profile.release]
panic = "abort"               # rust.md section 4: a panic ends the whole process, never one thread
overflow-checks = true        # wrong arithmetic must stop the process, not command a drive
debug = "line-tables-only"    # readable backtraces from the Pi
lto = "thin"

[profile.dev]
panic = "abort"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
exit = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "warn"
float_cmp = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
mem_forget = "deny"
await_holding_lock = "deny"
large_stack_arrays = "deny"
large_stack_frames = "warn"
undocumented_unsafe_blocks = "deny"
