# CI gates, rust.md section 13. Gates 1 to 5 are scripts/check.sh, the same command run locally before a push.
# Gate 7 is the sim suite against sim-drive on vcan (scripts/sim.sh); it is never skipped silently.
# Gate 6 cross-builds every crate and binary for the Pi (aarch64), so the linker is exercised on every PR.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests, deny, repo rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151,cargo-deny@0.20.2   # pinned; bump in its own PR
      - run: ./scripts/check.sh

  sim:
    name: sim suite on vcan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151   # pinned; bump in its own PR
      - name: Create vcan can0 to can4, the skeleton's bus names (PLAN item 4)
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" iproute2
          sudo modprobe vcan
          for bus in can0 can1 can2 can3 can4; do
            sudo ip link add dev "$bus" type vcan
            sudo ip link set "$bus" up
          done
          ip -brief link show type vcan
      - run: ./scripts/sim.sh

  pi-build:
    name: release build for the Pi (aarch64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install the aarch64 linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo build --release --workspace --locked --target aarch64-unknown-linux-gnu
