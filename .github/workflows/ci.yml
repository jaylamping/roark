# CI gates, rust.md section 13. Gates 1 to 5 are scripts/check.sh, the same command run locally before a push.
# Gate 7 (the sim-drive suite on vcan) joins with the first sim test (PLAN item 4); it is never skipped silently.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests, deny, repo rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - run: ./scripts/check.sh

  pi-build:
    name: release build for the Pi (aarch64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install the aarch64 linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo build --release --workspace --locked --target aarch64-unknown-linux-gnu
