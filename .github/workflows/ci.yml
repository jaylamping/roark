# CI gates, rust.md section 13. Gates 1 to 5 are scripts/check.sh, the same command run locally before a push.
# Gate 7 is the sim suite against sim-drive on vcan (scripts/sim.sh); it is never skipped silently.
# Gate 6 cross-builds every crate and binary for the Pi (aarch64), so the linker is exercised on every PR.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests, deny, repo rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151,cargo-deny@0.20.2   # pinned; bump in its own PR
      # The gate's mesh libraries (tools/cad/gate.py MESH_LIBS), so the gate and mesh tests run here instead of skipping;
      # trimesh has no Ubuntu package. Pinned; bump in its own PR.
      - name: Install pytest and the gate's mesh libraries for the CAD tool tests
        run: >-
          python3 -m pip install --user --break-system-packages
          pytest==9.2.0 numpy==2.5.4 scipy==1.18.1 trimesh==5.2.0 rtree==1.4.1 networkx==3.7
      - run: ./scripts/check.sh

  sim:
    name: sim suite on vcan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151   # pinned; bump in its own PR
      - name: Create vcan can0 to can4, the skeleton's bus names (PLAN item 4)
        run: |
          # vcan ships in the base modules of some runner kernels and in linux-modules-extra on others.
          if ! sudo modprobe vcan; then
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe vcan
          fi
          for bus in can0 can1 can2 can3 can4; do
            sudo ip link add dev "$bus" type vcan
            sudo ip link set "$bus" up
          done
          ip -brief link show type vcan
      - name: Install can-utils (candump, the independent capture the bus recording is checked against)
        run: sudo apt-get update && sudo apt-get install -y can-utils
      - run: ./scripts/sim.sh

  pi-build:
    name: release build for the Pi (aarch64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install the aarch64 linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo build --release --workspace --locked --target aarch64-unknown-linux-gnu
      # The binaries the Pi runs, built from this commit: what a deploy or a bench session installs
      # (docs/pi-setup.md section 12), so nobody needs a cross-compiler of their own.
      - name: Collect the Pi binaries
        run: |
          mkdir pi-binaries
          cp target/aarch64-unknown-linux-gnu/release/{runtime,robot-cli,candump-rotate,can-bench,sim-drive} pi-binaries/
          git rev-parse HEAD > pi-binaries/GIT_REV
          (cd pi-binaries && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: pi-binaries
          path: pi-binaries/
          retention-days: 30
