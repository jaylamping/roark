# cargo-deny (rust.md section 9): licences, advisories, bans and sources.
[graph]
all-features = true

[advisories]
# Every ignore carries a reason and a "Review: YYYY-MM" date.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, not unsound; mcap uses it at build time only. Review: 2027-05" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-3-Clause"]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Only these may open a CAN socket (architecture.md section 2: one process owns motion; sim-drive answers only on vcan;
# robot-cli for `disable` alone, after the runtime has exited; can-bench to measure an interface with no drive on it).
deny = [
    { crate = "socketcan", wrappers = ["can", "can-bench", "robot-cli", "sim-drive", "sim-suite"], reason = "only the bus layer, the independent disable, the simulator and the interface bench open CAN sockets" },
]
allow-wildcard-paths = true
skip = [
    { crate = "syn@2", reason = "mcap's binrw and enumset derives are still on syn 2; build time only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
