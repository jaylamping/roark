[package]
name = "can"
description = "The bus layer: one blocking thread per CAN bus running the tick, recorded from its first frame"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `Snapshot::from_parts`, for the unit tests of crates that read snapshots. Never in a normal build.
test-support = []

[dependencies]
robstride.workspace = true
telemetry.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
nix.workspace = true
rtrb.workspace = true
serde_json.workspace = true
socketcan.workspace = true

[lints]
workspace = true
