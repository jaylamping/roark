# Realtime crate (rust.md section 2): the workspace rules plus the bans on reading the clock and sleeping, because time
# is passed in by the loop (architecture.md section 9). Keep the shared part in step with the root clippy.toml.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
doc-valid-idents = ["RobStride", "SocketCAN", ".."]

disallowed-methods = [
  { path = "std::panic::catch_unwind", reason = "we run panic = abort; a caught panic leaves a half-alive process" },
  { path = "std::sync::mpsc::channel", reason = "unbounded; use a bounded queue so overload is visible" },
  { path = "std::time::Instant::now", reason = "time is passed in by the loop so tests can step it" },
  { path = "std::time::SystemTime::now", reason = "wall clock is for logs only, and not in this crate" },
  { path = "std::thread::sleep", reason = "the loop owns timing; this crate never waits" },
]
