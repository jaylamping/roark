[package]
name = "safety"
description = "Preflight, the enable sequence, the drive and limb states and the host rules (PLAN item 6, tenet 3)"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
can.workspace = true
robstride.workspace = true
skeleton.workspace = true

[lints]
workspace = true

[features]
# Lets this crate's own tests build a `Seen` from parts (`Seen::from_parts`); the runtime builds one only from a whole
# snapshot (`Seen::of`). Only the dev-dependency below turns it on, for test builds.
test-support = []

[dev-dependencies]
safety = { path = ".", features = ["test-support"] }
